# Start everything:   docker compose up -d --build
# Secrets live in .env (create it with: sh scripts/generate-secrets.sh)

name: bastion

x-hardening: &hardening
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

services:
  caddy:
    <<: *hardening
    build:
      context: .
      dockerfile: infra/caddy/Dockerfile
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    depends_on:
      api:
        condition: service_healthy
    networks: [edge]

  api:
    <<: *hardening
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    environment:
      NODE_ENV: production
      PORT: "3000"
      PUBLIC_ORIGIN: https://${DOMAIN}
      TRUST_PROXY_HOPS: "1"
      DATABASE_URL: postgres://bastion_app:${APP_DB_PASSWORD:?}@postgres:5432/bastion
      REDIS_URL: redis://:${REDIS_PASSWORD:?}@redis:6379
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    # No published ports: reachable only through Caddy.
    networks: [edge, internal]

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["node", "dist/infrastructure/database/migrate.js"]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      MIGRATION_DATABASE_URL: postgres://bastion_owner:${POSTGRES_PASSWORD:?}@postgres:5432/bastion
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks: [internal]

  postgres:
    <<: *hardening
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bastion
      POSTGRES_USER: bastion_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --data-checksums"
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bastion_owner -d bastion"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  redis:
    <<: *hardening
    image: redis:7-alpine
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?}
      - --appendonly
      - "yes"
      - --protected-mode
      - "yes"
      # Disable commands an attacker could abuse if they ever reached Redis.
      - --rename-command
      - FLUSHALL
      - ""
      - --rename-command
      - FLUSHDB
      - ""
      - --rename-command
      - CONFIG
      - ""
      - --rename-command
      - DEBUG
      - ""
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
    networks: [internal]

networks:
  edge: {}
  # Database and Redis are on a network with no route to the internet.
  internal:
    internal: true

volumes:
  caddy_data: {}
  caddy_config: {}
  pg_data: {}
  redis_data: {}
